services:
  db:
    image: postgis/postgis:15-3.3
    environment:
      POSTGRES_USER: smarttrip
      POSTGRES_PASSWORD: smarttrip
      POSTGRES_DB: smarttrip
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smarttrip -d smarttrip"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://smarttrip:smarttrip@db:5432/smarttrip
      REDIS_URL: redis://redis:6379/0
      USE_MOCK_FLIGHTS: "true"
      USE_MOCK_WEATHER: "true"
      USE_MOCK_PAYMENTS: "true"
      USE_MOCK_MAPS: "true"
      USE_MOCK_AI: "true"
      USE_MOCK_AUTH: "true"
      USE_MOCK_PUSH: "true"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
